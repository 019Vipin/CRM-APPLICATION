version: "3.9"

services:
  # ─────────────── MongoDB ───────────────
  mongo:
    image: mongo:7
    container_name: crm-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────── Redis ───────────────
  redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────── CRM Service ───────────────
  crm-service:
    build:
      context: ./CRMAPP
      dockerfile: Dockerfile
    container_name: crm-service
    restart: unless-stopped
    ports:
      - "7777:7777"
    environment:
      PORT: 7777
      MONGODB_URI: mongodb://mongo:27017/crm
      SECRET: ${SECRET:-mySuperSecretKey_changeInProduction}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_QUEUE: crm:notifications
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm-network

  # ─────────────── Notification Service ───────────────
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: crm-notification
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      NOTIFICATION_PORT: 8888
      MONGODB_URI: mongodb://mongo:27017/crm
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_QUEUE: crm:notifications
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm-network

volumes:
  mongo_data:

networks:
  crm-network:
    driver: bridge
